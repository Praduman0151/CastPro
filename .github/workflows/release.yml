name: Build & Release CastPro Phone + TV APKs

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (for example v2.2.0-rc.1 or v2.2.0)"
        required: true
        default: "v2.2.0-rc.1"
        type: string
      prerelease:
        description: "Publish as prerelease. Stable requires a hardware proof reference."
        required: true
        default: true
        type: boolean
      hardware_proof_reference:
        description: "Required for a stable release: issue/PR URL with clean TV screenshot proof"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: castpro-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build signed Phone and TV APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate release version
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
          PRERELEASE: ${{ inputs.prerelease }}
          HARDWARE_PROOF: ${{ inputs.hardware_proof_reference }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$INPUT_TAG"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Invalid release tag: $TAG (expected vX.Y.Z)"
            exit 1
          fi
          if [[ "$PRERELEASE" != "true" && -z "$HARDWARE_PROOF" ]]; then
            echo "::error::A stable release requires hardware_proof_reference with clean TV screenshot evidence."
            exit 1
          fi
          VERSION="${TAG#v}"
          BASE_VERSION="${VERSION%%[-+]*}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          VERSION_CODE=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))
          if (( VERSION_CODE < 1 || VERSION_CODE > 2100000000 )); then
            echo "::error::Calculated Android versionCode is out of range: $VERSION_CODE"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Ensure Android 35 SDK, NDK, and CMake
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMGR" ]]; then
            SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -perm -u+x | head -n 1)
          fi
          test -x "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null || true
          if [[ ! -d "$ANDROID_HOME/platforms/android-35" ]]; then "$SDKMGR" "platforms;android-35"; fi
          if [[ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]]; then "$SDKMGR" "build-tools;35.0.0"; fi
          if [[ ! -d "$ANDROID_HOME/ndk/27.2.12479018" ]]; then "$SDKMGR" "ndk;27.2.12479018"; fi
          if [[ ! -d "$ANDROID_HOME/cmake/3.22.1" ]]; then "$SDKMGR" "cmake;3.22.1"; fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Validate signing secrets and decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name repository secret is missing."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/castpro-release.jks"
          test -s "$RUNNER_TEMP/castpro-release.jks"
          chmod 600 "$RUNNER_TEMP/castpro-release.jks"

      - name: Build both signed release APKs
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/castpro-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          CASTPRO_VERSION_NAME: ${{ steps.release.outputs.version }}
          CASTPRO_VERSION_CODE: ${{ steps.release.outputs.version_code }}
        run: |
          ./gradlew --no-daemon --stacktrace \
            :app-phone:clean :app-tv:clean \
            :app-phone:assembleRelease :app-tv:assembleRelease

      - name: Verify APKs, package source, and generate SHA-256 checksums
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          PHONE_APK="app-phone/build/outputs/apk/release/app-phone-release.apk"
          TV_APK="app-tv/build/outputs/apk/release/app-tv-release.apk"
          test -s "$PHONE_APK"
          test -s "$TV_APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$PHONE_APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$TV_APK"
          cp "$PHONE_APK" "release-assets/CastPro-Phone-${RELEASE_TAG}.apk"
          cp "$TV_APK" "release-assets/CastPro-TV-${RELEASE_TAG}.apk"
          git ls-files | zip -q -@ "release-assets/CastPro-full-project-${RELEASE_TAG}.zip"
          cd release-assets
          for file in *.apk *.zip; do
            sha256sum "$file" > "$file.sha256"
          done
          sha256sum -c *.sha256
          cat *.sha256 > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: CastPro ${{ steps.release.outputs.tag }}
          body: |
            ${{ fromJSON(inputs.prerelease) == true && 'Pre-release for hardware validation. Do not treat as stable.' || format('Stable release. Hardware proof: {0}', inputs.hardware_proof_reference) }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ fromJSON(inputs.prerelease) }}
          fail_on_unmatched_files: true
          files: |
            release-assets/CastPro-Phone-${{ steps.release.outputs.tag }}.apk
            release-assets/CastPro-Phone-${{ steps.release.outputs.tag }}.apk.sha256
            release-assets/CastPro-TV-${{ steps.release.outputs.tag }}.apk
            release-assets/CastPro-TV-${{ steps.release.outputs.tag }}.apk.sha256
            release-assets/CastPro-full-project-${{ steps.release.outputs.tag }}.zip
            release-assets/CastPro-full-project-${{ steps.release.outputs.tag }}.zip.sha256
            release-assets/SHA256SUMS.txt

      - name: Remove signing keystore from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/castpro-release.jks"
