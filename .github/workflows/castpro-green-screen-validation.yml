name: CastPro Green Screen Validation

on:
  push:
    branches:
      - fix/castpro-green-screen
  pull_request:
    branches:
      - main

jobs:
  android-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run requested tests and APK builds
        run: ./gradlew :core-common:testDebugUnitTest :core-streaming:testDebugUnitTest :app-phone:assembleDebug :app-tv:assembleDebug
